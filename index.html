<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ditado Vídeo</title>
<style>
:root{
  --bg:#f3f5f7;--panel:#fff;--ink:#1c2430;--muted:#66717f;--line:#d9dee5;
  --accent:#0b6e8a;--accent-ink:#fff;--rec:#d23b3b;--sel:#e3f1f5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b;--panel:#1b2128;--ink:#e6eaef;--muted:#9aa5b1;--line:#2c343e;
  --accent:#3aa7c4;--accent-ink:#06222b;--rec:#ff5a5a;--sel:#203a44;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650}
header .sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
main{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px;height:calc(100vh - 53px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel h2 .sp{flex:1}
.list{overflow:auto;flex:1}
.item{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--sel)}
.item.on{background:var(--sel);box-shadow:inset 3px 0 var(--accent)}
.item small{color:var(--muted);display:block}
.pad{padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#work{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
#stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#stage video,#stage img{max-width:100%;max-height:100%}
#stage.oto video,#stage.oto img{-webkit-mask:radial-gradient(ellipse 36.5% 48.5% at 49% 50%,#000 99%,transparent 100%);mask:radial-gradient(ellipse 36.5% 48.5% at 49% 50%,#000 99%,transparent 100%)}
#stage .empty{color:#aaa;text-align:center;padding:20px}
#recBadge{position:absolute;top:10px;left:10px;background:var(--rec);color:#fff;padding:3px 8px;border-radius:4px;font-weight:600;display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px;border-top:1px solid var(--line);min-height:100px}
.thumb{position:relative;flex:0 0 auto;width:120px;height:80px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:#000}
.thumb.on{border-color:var(--accent)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;bottom:2px;right:4px;color:#fff;font-size:11px;text-shadow:0 0 3px #000}
.thumb input{position:absolute;top:3px;left:3px;width:auto}
.tools{padding:8px 10px;border-bottom:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.muted{color:var(--muted)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#stage{min-height:260px}.panel{max-height:none}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}}
#printArea{display:none}
@media print{#printArea{display:block;color:#000;background:#fff;padding:20px}#printArea img{width:48%;margin:1%}}
</style>
</head>
<body>
<header>
  <h1>Ditado Vídeo</h1>
  <span class="muted" id="who"></span>
  <span class="sp"></span>
  <button id="btnQuick" title="Sessão rápida sem doente">Início rápido</button>
  <button id="btnSettings">Definições</button>
  <button id="btnBackup">Cópia de segurança</button>
  <button id="btnRestore">Restaurar</button>
  <input type="file" id="restoreFile" accept=".json" hidden>
</header>
<main>
  <section class="panel">
    <h2>Doentes <span class="sp"></span><button class="pri" id="btnNewPat">+ Novo</button></h2>
    <div class="pad"><input id="search" placeholder="Pesquisar nome, ID, data de nascimento…"></div>
    <div class="list" id="patList"></div>
    <h2>Sessões <span class="sp"></span>
      <button id="btnNewSession" disabled>+ Nova</button></h2>
    <div class="list" id="sesList" style="max-height:30%"></div>
  </section>

  <section class="panel" id="work">
    <div class="tools">
      <div class="row">
        <strong id="title">Nenhum doente selecionado</strong>
        <span class="sp" style="flex:1"></span>
        <select id="device" style="width:auto"></select>
        <button id="btnLive">Ligar câmara</button>
        <button id="btnSnap" disabled title="Espaço">📷 Fotografia</button>
        <button id="btnRec" disabled title="R">● Gravar</button>
      </div>
      <div class="row" style="margin-top:6px">
        <label class="row" style="gap:4px"><input type="checkbox" id="oto" style="width:auto"> Máscara circular (otoscopia)</label>
        <span class="sp" style="flex:1"></span>
        <button id="btnStepB" title="Frame anterior">⏮</button>
        <button id="btnPlay">▶︎/❚❚</button>
        <button id="btnStepF" title="Frame seguinte">⏭</button>
        <label class="row" style="gap:4px"><input type="checkbox" id="loop" style="width:auto"> Repetir</label>
        <button id="btnFull">Ecrã inteiro</button>
      </div>
    </div>
    <div id="stage"><div class="empty">Selecione ou crie um doente e uma sessão.<br>Depois ligue a câmara para capturar imagens ou vídeo.</div><div id="recBadge">● REC 00:00</div><div id="flash"></div></div>
    <div>
      <div class="row pad" style="border-top:1px solid var(--line);padding-bottom:0">
        <span class="muted" id="count"></span><span class="sp" style="flex:1"></span>
        <button id="btnImport">Importar ficheiros</button>
        <input type="file" id="importFile" multiple accept="image/*,video/*" hidden>
        <button id="btnDownload">Exportar selecionados</button>
        <button id="btnClip">Copiar imagem</button>
        <button id="btnPrint">Imprimir relatório</button>
        <button id="btnDelMedia">Apagar</button>
      </div>
      <div class="strip" id="strip"></div>
    </div>
  </section>
</main>

<dialog id="patDlg"><form method="dialog">
  <h3 id="patDlgTitle">Novo doente</h3>
  <div class="form">
    <label>Apelido*<input name="surname" required></label>
    <label>Nome próprio*<input name="given" required></label>
    <label>Data de nascimento<input name="birth" type="date"></label>
    <label>Género<select name="gender"><option value="">—</option><option>F</option><option>M</option><option>Outro</option></select></label>
    <label>N.º processo / ID<input name="pid"></label>
    <label>Telefone<input name="phone"></label>
    <label class="full">Morada<input name="address"></label>
    <label class="full">Observações<textarea name="comment" rows="3"></textarea></label>
  </div>
  <div class="row" style="margin-top:14px;justify-content:space-between">
    <button type="button" id="patDel" class="rec">Apagar doente</button>
    <span class="row"><button value="cancel" formnovalidate>Cancelar</button><button class="pri" value="ok">Guardar</button></span>
  </div>
</form></dialog>

<dialog id="sesDlg"><form method="dialog">
  <h3>Nova sessão</h3>
  <div class="form">
    <label>Tipo<select name="type"><option>Endoscopia</option><option>Otoscopia</option><option>Laringoscopia</option><option>Rinoscopia</option><option>Documentação fotográfica</option><option>Outro</option></select></label>
    <label>Médico<select name="physician"></select></label>
    <label class="full">Diagnóstico<input name="diagnosis"></label>
    <label class="full">Notas / ditado<textarea name="notes" rows="4"></textarea></label>
  </div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button value="cancel" formnovalidate>Cancelar</button><button class="pri" value="ok">Guardar</button></div>
</form></dialog>

<dialog id="setDlg"><form method="dialog">
  <h3>Definições</h3>
  <div class="form">
    <label class="full">Médicos (um por linha)<textarea name="physicians" rows="4"></textarea></label>
    <label>Qualidade JPEG (0.5–1)<input name="jpeg" type="number" step="0.05" min="0.5" max="1"></label>
    <label>Resolução preferida<select name="res"><option value="640x480">640×480</option><option value="1280x720">1280×720</option><option value="1920x1080">1920×1080</option></select></label>
    <label class="row full" style="flex-direction:row;color:var(--ink)"><input type="checkbox" name="sound" style="width:auto"> Som ao fotografar / gravar</label>
    <label class="row full" style="flex-direction:row;color:var(--ink)"><input type="checkbox" name="audio" style="width:auto"> Gravar áudio com o vídeo</label>
  </div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button value="cancel" formnovalidate>Cancelar</button><button class="pri" value="ok">Guardar</button></div>
</form></dialog>

<div id="printArea"></div>

<script>
// ---------- Armazenamento (IndexedDB) ----------
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('ditado-video', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('patients', {keyPath: 'id'});
      d.createObjectStore('sessions', {keyPath: 'id'}).createIndex('pat', 'patientId');
      d.createObjectStore('media', {keyPath: 'id'}).createIndex('ses', 'sessionId');
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
  const p = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    open,
    all: s => p(tx(s).getAll()),
    by: (s, idx, v) => p(tx(s).index(idx).getAll(v)),
    put: (s, o) => p(tx(s, 'readwrite').put(o)),
    del: (s, k) => p(tx(s, 'readwrite').delete(k)),
  };
})();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-PT') : '';
const fmtDT = d => new Date(d).toLocaleString('pt-PT', {dateStyle: 'short', timeStyle: 'short'});

// ---------- Definições ----------
const defaults = {physicians: ['Dr. Exemplo'], jpeg: 0.92, res: '1280x720', sound: true, audio: false, oto: false};
let settings = defaults;
try { settings = {...defaults, ...JSON.parse(localStorage.getItem('dv-settings') || '{}')}; } catch {}
const saveSettings = () => { try { localStorage.setItem('dv-settings', JSON.stringify(settings)); } catch {} };

// ---------- Estado ----------
let patients = [], sessions = [], media = [];
let curPat = null, curSes = null, curMedia = null;
let stream = null, recorder = null, recChunks = [], recStart = 0, recTimer = null;
const selected = new Set();
const urls = new Map();
const urlFor = m => { if (!urls.has(m.id)) urls.set(m.id, URL.createObjectURL(m.blob)); return urls.get(m.id); };

// ---------- Doentes ----------
async function loadPatients() {
  patients = (await DB.all('patients')).sort((a, b) => (a.surname + a.given).localeCompare(b.surname + b.given));
  renderPatients();
}
function renderPatients() {
  const q = $('#search').value.trim().toLowerCase();
  const list = patients.filter(p => !q || [p.surname, p.given, p.pid, fmtDate(p.birth)].join(' ').toLowerCase().includes(q));
  $('#patList').innerHTML = list.map(p => `<div class="item ${p.id === curPat?.id ? 'on' : ''}" data-id="${p.id}">
    <b>${esc(p.surname)}, ${esc(p.given)}</b>${p.quick ? ' <span class="muted">(rápido)</span>' : ''}
    <small>${p.pid ? 'ID ' + esc(p.pid) + ' · ' : ''}${fmtDate(p.birth)} ${esc(p.gender || '')}</small></div>`).join('')
    || '<div class="pad muted">Sem doentes.</div>';
}
$('#patList').onclick = e => { const it = e.target.closest('.item'); if (it) selectPatient(it.dataset.id); };
$('#patList').ondblclick = e => { const it = e.target.closest('.item'); if (it) editPatient(patients.find(p => p.id === it.dataset.id)); };
$('#search').oninput = renderPatients;

async function selectPatient(id) {
  curPat = patients.find(p => p.id === id) || null;
  curSes = null; curMedia = null; selected.clear();
  renderPatients();
  $('#btnNewSession').disabled = !curPat;
  await loadSessions();
}

function editPatient(p) {
  const f = $('#patDlg form');
  f.reset();
  $('#patDlgTitle').textContent = p ? 'Editar doente' : 'Novo doente';
  $('#patDel').style.visibility = p ? 'visible' : 'hidden';
  if (p) for (const k of ['surname', 'given', 'birth', 'gender', 'pid', 'phone', 'address', 'comment']) f.elements[k].value = p[k] || '';
  $('#patDlg').onclose = async () => {
    if ($('#patDlg').returnValue !== 'ok') return;
    const data = Object.fromEntries(new FormData(f));
    if (data.birth && new Date(data.birth) > new Date()) return alert('A data de nascimento tem de estar no passado.');
    const dup = patients.find(x => x.id !== p?.id && data.pid && x.pid === data.pid);
    if (dup && !confirm(`Já existe um doente com o ID ${data.pid} (${dup.surname}, ${dup.given}). Continuar?`)) return;
    const o = {...(p || {id: uid(), created: Date.now()}), ...data, quick: false, modified: Date.now()};
    await DB.put('patients', o);
    await loadPatients();
    selectPatient(o.id);
  };
  $('#patDlg').showModal();
}
$('#btnNewPat').onclick = () => editPatient(null);
$('#patDel').onclick = async () => {
  if (!curPat || !confirm(`Apagar ${curPat.surname}, ${curPat.given} e todas as sessões/imagens?`)) return;
  $('#patDlg').close('cancel');
  for (const s of await DB.by('sessions', 'pat', curPat.id)) await deleteSession(s.id);
  await DB.del('patients', curPat.id);
  curPat = null; await loadPatients(); await loadSessions();
};
$('#btnQuick').onclick = async () => {
  const now = new Date();
  const p = {id: uid(), created: Date.now(), quick: true, surname: 'Rápido', given: now.toLocaleString('pt-PT')};
  await DB.put('patients', p); await loadPatients(); await selectPatient(p.id);
  await createSession({type: 'Endoscopia', physician: settings.physicians[0] || ''});
};

// ---------- Sessões ----------
async function loadSessions() {
  sessions = curPat ? (await DB.by('sessions', 'pat', curPat.id)).sort((a, b) => b.created - a.created) : [];
  $('#sesList').innerHTML = sessions.map(s => `<div class="item ${s.id === curSes?.id ? 'on' : ''}" data-id="${s.id}">
    <b>${esc(s.type)}</b> <small>${fmtDT(s.created)} · ${esc(s.physician || '')}${s.diagnosis ? ' · ' + esc(s.diagnosis) : ''}</small></div>`).join('')
    || `<div class="pad muted">${curPat ? 'Sem sessões. Crie uma nova.' : ''}</div>`;
  $('#title').textContent = curPat ? `${curPat.surname}, ${curPat.given}${curSes ? ' — ' + curSes.type + ' ' + fmtDT(curSes.created) : ''}` : 'Nenhum doente selecionado';
  await loadMedia();
}
$('#sesList').onclick = e => { const it = e.target.closest('.item'); if (it) { curSes = sessions.find(s => s.id === it.dataset.id); curMedia = null; selected.clear(); loadSessions(); } };
$('#sesList').ondblclick = e => { const it = e.target.closest('.item'); if (it) editSession(sessions.find(s => s.id === it.dataset.id)); };

function editSession(s) {
  const f = $('#sesDlg form'); f.reset();
  f.elements.physician.innerHTML = settings.physicians.map(x => `<option>${esc(x)}</option>`).join('');
  if (s) for (const k of ['type', 'physician', 'diagnosis', 'notes']) f.elements[k].value = s[k] || '';
  $('#sesDlg').onclose = async () => {
    if ($('#sesDlg').returnValue !== 'ok') return;
    const data = Object.fromEntries(new FormData(f));
    if (s) { Object.assign(s, data); await DB.put('sessions', s); await loadSessions(); }
    else await createSession(data);
  };
  $('#sesDlg').showModal();
}
async function createSession(data) {
  const s = {id: uid(), patientId: curPat.id, created: Date.now(), ...data};
  await DB.put('sessions', s); curSes = s; await loadSessions();
}
async function deleteSession(id) {
  for (const m of await DB.by('media', 'ses', id)) await DB.del('media', m.id);
  await DB.del('sessions', id);
}
$('#btnNewSession').onclick = () => editSession(null);

// ---------- Média ----------
async function loadMedia() {
  media = curSes ? (await DB.by('media', 'ses', curSes.id)).sort((a, b) => a.created - b.created) : [];
  $('#strip').innerHTML = media.map((m, i) => `<div class="thumb ${m.id === curMedia?.id ? 'on' : ''}" data-id="${m.id}">
    <input type="checkbox" ${selected.has(m.id) ? 'checked' : ''} title="Selecionar">
    ${m.kind === 'video' ? `<video src="${urlFor(m)}#t=0.1" muted preload="metadata"></video><span>🎬 ${i + 1}</span>` : `<img src="${urlFor(m)}"><span>${i + 1}</span>`}</div>`).join('');
  const nImg = media.filter(m => m.kind === 'image').length;
  $('#count').textContent = curSes ? `${nImg} imagem(ns), ${media.length - nImg} vídeo(s)` : '';
  updateButtons();
}
$('#strip').onclick = e => {
  const t = e.target.closest('.thumb'); if (!t) return;
  if (e.target.type === 'checkbox') { e.target.checked ? selected.add(t.dataset.id) : selected.delete(t.dataset.id); return; }
  showMedia(media.find(m => m.id === t.dataset.id));
};
function showMedia(m) {
  curMedia = m;
  document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('on', t.dataset.id === m.id));
  const st = $('#stage'); st.querySelector('video,img,.empty')?.remove();
  const el = document.createElement(m.kind === 'video' ? 'video' : 'img');
  el.src = urlFor(m);
  if (m.kind === 'video') { el.controls = true; el.loop = $('#loop').checked; }
  st.prepend(el);
}
async function addMedia(blob, kind) {
  const m = {id: uid(), sessionId: curSes.id, created: Date.now(), kind, type: blob.type, blob};
  await DB.put('media', m); await loadMedia();
}
const targets = () => selected.size ? media.filter(m => selected.has(m.id)) : curMedia ? [curMedia] : [];

// ---------- Câmara ----------
async function listDevices() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  $('#device').innerHTML = devs.map((d, i) => `<option value="${d.deviceId}">${esc(d.label || 'Câmara ' + (i + 1))}</option>`).join('') || '<option value="">Câmara predefinida</option>';
  if (settings.device) $('#device').value = settings.device;
}
async function startLive() {
  stopLive();
  const [w, h] = settings.res.split('x').map(Number);
  const dev = $('#device').value;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: w}, height: {ideal: h}, ...(dev ? {deviceId: {exact: dev}} : {})}, audio: settings.audio});
  } catch (e) { return alert('Não foi possível iniciar a câmara: ' + e.message); }
  await listDevices();
  const st = $('#stage'); st.querySelector('video,img,.empty')?.remove();
  const v = document.createElement('video'); v.id = 'live'; v.muted = true; v.autoplay = true; v.playsInline = true; v.srcObject = stream;
  st.prepend(v); curMedia = null;
  $('#btnLive').textContent = 'Desligar câmara';
  updateButtons();
}
function stopLive() {
  if (recorder) stopRec();
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('#live')?.remove();
  $('#btnLive').textContent = 'Ligar câmara';
  updateButtons();
}
$('#btnLive').onclick = () => stream ? stopLive() : startLive();
$('#device').onchange = () => { settings.device = $('#device').value; saveSettings(); if (stream) startLive(); };

function beep(freq = 880, dur = .08) {
  if (!settings.sound) return;
  try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = freq; g.gain.value = .15; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur); } catch {}
}
async function snapshot() {
  const v = $('#live'); if (!v || !curSes) return;
  const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext('2d'); x.drawImage(v, 0, 0);
  if ($('#oto').checked) { // aplicar máscara circular à imagem guardada
    x.globalCompositeOperation = 'destination-in'; x.beginPath();
    x.ellipse(c.width * .49, c.height * .5, c.width * .365, c.height * .485, 0, 0, Math.PI * 2); x.fill();
    x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', settings.jpeg));
  beep(); const f = $('#flash'); f.style.opacity = .7; setTimeout(() => f.style.opacity = 0, 80);
  await addMedia(blob, 'image');
}
function startRec() {
  if (!stream || !curSes) return;
  const mime = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  recorder = new MediaRecorder(stream, mime ? {mimeType: mime} : {}); recChunks = [];
  recorder.ondataavailable = e => e.data.size && recChunks.push(e.data);
  recorder.onstop = () => addMedia(new Blob(recChunks, {type: recorder.mimeType}), 'video').then(() => recorder = null);
  recorder.start(1000); recStart = Date.now(); beep(660, .15);
  $('#recBadge').style.display = 'block';
  recTimer = setInterval(() => { const s = Math.floor((Date.now() - recStart) / 1000); $('#recBadge').textContent = `● REC ${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }, 500);
  $('#btnRec').textContent = '■ Parar'; $('#btnRec').classList.add('rec');
}
function stopRec() {
  recorder?.state !== 'inactive' && recorder?.stop(); clearInterval(recTimer); beep(440, .15);
  $('#recBadge').style.display = 'none'; $('#btnRec').textContent = '● Gravar'; $('#btnRec').classList.remove('rec');
}
$('#btnSnap').onclick = snapshot;
$('#btnRec').onclick = () => recorder ? stopRec() : startRec();
$('#oto').onchange = () => { $('#stage').classList.toggle('oto', $('#oto').checked); settings.oto = $('#oto').checked; saveSettings(); };

// ---------- Reprodução ----------
const vid = () => $('#stage video:not(#live)');
$('#btnPlay').onclick = () => { const v = vid(); if (v) v.paused ? v.play() : v.pause(); };
const step = d => { const v = vid(); if (v) { v.pause(); v.currentTime = Math.max(0, v.currentTime + d / 25); } };
$('#btnStepF').onclick = () => step(1);
$('#btnStepB').onclick = () => step(-1);
$('#loop').onchange = () => { const v = vid(); if (v) v.loop = $('#loop').checked; };
$('#btnFull').onclick = () => $('#stage').requestFullscreen?.();

// ---------- Exportar / importar ----------
const baseName = m => `${(curPat?.surname || 'doente').replace(/\W+/g, '_')}_${new Date(m.created).toISOString().slice(0, 19).replace(/[:T]/g, '-')}`;
$('#btnDownload').onclick = () => targets().forEach(m => {
  const a = document.createElement('a'); a.href = urlFor(m);
  a.download = baseName(m) + (m.kind === 'video' ? (m.type.includes('mp4') ? '.mp4' : '.webm') : '.jpg'); a.click();
});
$('#btnClip').onclick = async () => {
  const m = targets().find(m => m.kind === 'image'); if (!m) return alert('Selecione uma imagem.');
  try {
    const img = await createImageBitmap(m.blob); const c = new OffscreenCanvas(img.width, img.height); c.getContext('2d').drawImage(img, 0, 0);
    await navigator.clipboard.write([new ClipboardItem({'image/png': await c.convertToBlob({type: 'image/png'})})]);
  } catch (e) { alert('Não foi possível copiar: ' + e.message); }
};
$('#btnImport').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  for (const f of e.target.files) await addMedia(f, f.type.startsWith('video') ? 'video' : 'image');
  e.target.value = '';
};
$('#btnDelMedia').onclick = async () => {
  const t = targets(); if (!t.length || !confirm(`Apagar ${t.length} ficheiro(s)?`)) return;
  for (const m of t) { await DB.del('media', m.id); URL.revokeObjectURL(urls.get(m.id)); urls.delete(m.id); }
  selected.clear(); curMedia = null; $('#stage').querySelector('img,video:not(#live)')?.remove(); loadMedia();
};
$('#btnPrint').onclick = () => {
  if (!curSes) return;
  const imgs = (selected.size ? targets() : media).filter(m => m.kind === 'image');
  $('#printArea').innerHTML = `<h2>Relatório — ${esc(curSes.type)}</h2>
    <p><b>Doente:</b> ${esc(curPat.surname)}, ${esc(curPat.given)} ${curPat.birth ? '· Nasc. ' + fmtDate(curPat.birth) : ''} ${curPat.pid ? '· ID ' + esc(curPat.pid) : ''}<br>
    <b>Data:</b> ${fmtDT(curSes.created)} · <b>Médico:</b> ${esc(curSes.physician || '')}<br>
    ${curSes.diagnosis ? '<b>Diagnóstico:</b> ' + esc(curSes.diagnosis) + '<br>' : ''}
    ${curSes.notes ? '<b>Notas:</b> ' + esc(curSes.notes).replace(/\n/g, '<br>') : ''}</p>
    ${imgs.map(m => `<img src="${urlFor(m)}">`).join('')}`;
  setTimeout(() => print(), 300);
};

const toB64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
$('#btnBackup').onclick = async () => {
  const all = {version: 1, patients: await DB.all('patients'), sessions: await DB.all('sessions'), media: []};
  for (const m of await DB.all('media')) all.media.push({...m, blob: await toB64(m.blob)});
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(all)], {type: 'application/json'}));
  a.download = `ditado-video-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
};
$('#btnRestore').onclick = () => $('#restoreFile').click();
$('#restoreFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    for (const p of d.patients) await DB.put('patients', p);
    for (const s of d.sessions) await DB.put('sessions', s);
    for (const m of d.media) await DB.put('media', {...m, blob: await (await fetch(m.blob)).blob()});
    alert(`Restaurado: ${d.patients.length} doentes, ${d.sessions.length} sessões, ${d.media.length} ficheiros.`);
    loadPatients();
  } catch (err) { alert('Ficheiro inválido: ' + err.message); }
  e.target.value = '';
};

// ---------- Definições ----------
$('#btnSettings').onclick = () => {
  const f = $('#setDlg form');
  f.elements.physicians.value = settings.physicians.join('\n'); f.elements.jpeg.value = settings.jpeg;
  f.elements.res.value = settings.res; f.elements.sound.checked = settings.sound; f.elements.audio.checked = settings.audio;
  $('#setDlg').onclose = () => {
    if ($('#setDlg').returnValue !== 'ok') return;
    Object.assign(settings, {physicians: f.elements.physicians.value.split('\n').map(s => s.trim()).filter(Boolean),
      jpeg: +f.elements.jpeg.value || .92, res: f.elements.res.value, sound: f.elements.sound.checked, audio: f.elements.audio.checked});
    saveSettings();
  };
  $('#setDlg').showModal();
};

function updateButtons() {
  const live = !!stream, ok = live && !!curSes;
  $('#btnSnap').disabled = !ok; $('#btnRec').disabled = !ok && !recorder;
  for (const b of ['#btnDownload', '#btnClip', '#btnPrint', '#btnDelMedia', '#btnImport']) $(b).disabled = !curSes;
}

// Atalhos: Espaço = fotografia, R = gravar (como o pedal/botão da câmara)
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,dialog')) return;
  if (e.code === 'Space' && !$('#btnSnap').disabled) { e.preventDefault(); snapshot(); }
  if (e.key === 'r' && !$('#btnRec').disabled) $('#btnRec').click();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

(async () => {
  await DB.open();
  $('#oto').checked = settings.oto; $('#stage').classList.toggle('oto', settings.oto);
  await loadPatients(); updateButtons();
  try { await listDevices(); } catch {}
})();
</script>
</body>
</html>
